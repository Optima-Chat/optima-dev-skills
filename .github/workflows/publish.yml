name: Publish to npm

# 手动发版：gh workflow run publish.yml
# 用 repo secret NPM_TOKEN（granular token 须有 @optima-chat/dev-skills 的
# read+write packages 权限）。版本号取 package.json 当前值——发版前先在本地
# npm version patch 并 push。
on:
  workflow_dispatch:

jobs:
  publish:
    # tf#384：GitHub 托管 runner 2026-08-31 起被 Actions 预算卡死(job 不启动)，改走自家 CodeBuild runner(org 级 webhook，optima-terraform stacks/shared/073-codebuild-github-runner.tf)。
    runs-on: codebuild-optima-runner-x86-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # 回归网（如 #60 的参数解析）：不跑测试的发版会让静默回归直接出厂。
      # npm test 的 pretest 会再 build 一次，秒级，忍。
      - run: npm test
      # 必须 public：org 无私有包付费计划，restricted 会被 npm 以误导性的
      # E503（对已存在的包）/ E402（对新包）拒掉。本包本来就是 public。
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
